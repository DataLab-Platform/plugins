name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The latest DataLab release provides the dependencies plugins may require
      - run: pip install -r requirements.txt datalab-platform

      - run: python -m pytest tests

      - run: python tools/catalog.py check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
